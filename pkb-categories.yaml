# PKB categories
#
# Each entry becomes a tab on the 📓 Knowledge Base page, in this order.
# Rebuild Dashboards (Ctrl+Shift+B) after editing. The rebuild also updates
# the `category` dropdown in the PKB Note and KB Article templates to match.
#
#   name  Tab label, and the value notes use in `category:` frontmatter.
#         Matching is case-insensitive. No commas or | characters.
#   icon  Optional. Either an image path relative to docs/
#         (e.g. assets/images/kubernetes/logo.svg) or plain text such as an emoji.

categories:
  - name: Tools
  - name: Troubleshooting
  - name: Kubernetes
    icon: assets/images/kubernetes/logo.svg

# Catch-all tab for notes whose category is missing or not listed above.
other_tab: Other
